title: Nanyi Zhao
description: >-
  NYU CS & Math senior. Writing, selected projects, and working notes
  on AI tokenomics and token complexity.
baseurl: ""
url: "https://reagan-nz.github.io"

theme: minima

header_pages:
  - index.md
  - blog.md
  - research.md

author: Nanyi Zhao

github_username: reagan-nz
email: nz2295@nyu.edu

minima:
  show_excerpts: true
  date_format: "%b %-d, %Y"

markdown: kramdown
permalink: /:title/

collections:
  research:
    output: true
    permalink: /research/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_section: blog
  - scope:
      path: ""
      type: research
    values:
      layout: research-entry
      nav_section: research
      math: true

feed:
  collections:
    - research

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - AGENTS.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - research-private
  - _research/_template.md
  - node_modules
